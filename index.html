<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>malatyabasket.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fa; --surface:#ffffff; --ink:#0e1b33; --muted:#5b6678; --line:#dde2ec;
  --navy:#0f2a4d; --navy-ink:#ffffff; --orange:#f26a21; --orange-ink:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.55 Barlow,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* üst şerit */
.top{background:var(--navy);color:var(--navy-ink);font-size:14px}
.top .wrap{display:flex;justify-content:space-between;align-items:center;min-height:36px;gap:12px}
.top a{opacity:.85}.top a:hover{opacity:1}
#today{font-variant-numeric:tabular-nums;white-space:nowrap}

/* başlık ve menü */
header.site{background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;padding:16px 0}
.logo{width:64px;height:64px;flex:none;object-fit:contain;background:#fff;border-radius:8px;display:block}
.brand h1{font:700 30px/1 "Barlow Condensed",Barlow,sans-serif;margin:0;letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:14px;margin-top:4px}
nav.main{background:var(--navy)}
nav.main ul{list-style:none;margin:0;padding:0;display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav.main a{display:block;padding:14px 18px;color:var(--navy-ink);font:600 18px/1 "Barlow Condensed",Barlow,sans-serif;white-space:nowrap}
nav.main a:hover{background:rgba(255,255,255,.1)}
nav.main a.fix{background:var(--orange);color:var(--orange-ink)}
nav.main a.fix:hover{filter:brightness(1.08)}

/* manşet */
.hero{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin:22px 0}
.lead{position:relative;min-height:360px;border-radius:6px;overflow:hidden;background:var(--navy);color:#fff;display:flex;align-items:flex-end}
.lead .img{position:absolute;inset:0;background-size:cover;background-position:center}
.lead::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(8,18,38,.92) 5%,rgba(8,18,38,.1) 70%)}
.lead .txt{position:relative;z-index:1;padding:24px}
.lead h2{font:700 36px/1.08 "Barlow Condensed",Barlow,sans-serif;margin:8px 0}
.lead p{margin:0;opacity:.9;max-width:60ch}
.tag{display:inline-block;background:var(--orange);color:#fff;font:600 14px/1 Barlow,sans-serif;padding:5px 9px;border-radius:3px}
.lead.has-img{flex-direction:column;align-items:stretch;justify-content:flex-start;min-height:0}
.lead.has-img .img{position:relative;inset:auto;width:100%;aspect-ratio:16/9;background-color:#eef2f8}
.lead.has-img::after{display:none}
.lead.has-img .txt{padding:16px 24px 22px}
.lead.has-img h2{font-size:30px}
.side{display:flex;flex-direction:column;gap:16px}
.fixcard{background:var(--navy);color:#fff;border-radius:6px;padding:22px;border-left:6px solid var(--orange)}
.fixcard h3{font:700 28px/1.1 "Barlow Condensed",Barlow,sans-serif;margin:0 0 6px}
.fixcard p{margin:0 0 16px;opacity:.85;font-size:15px}
.btn{display:inline-block;background:var(--orange);color:#fff;font:600 19px/1 "Barlow Condensed",Barlow,sans-serif;padding:12px 20px;border-radius:4px}
.btn:hover{filter:brightness(1.08)}
.latest{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 18px;flex:1}
.latest h3{font:700 22px/1 "Barlow Condensed",Barlow,sans-serif;margin:14px 0 4px}
.latest a{display:block;padding:11px 0;border-top:1px solid var(--line);font-weight:500;line-height:1.35}
.latest a:first-of-type{border-top:0}
.latest a:hover{color:var(--orange)}
.latest time{display:block;color:var(--muted);font-size:13px;font-weight:400}

/* haber ızgarası */
.sec{display:flex;align-items:baseline;justify-content:space-between;border-bottom:3px solid var(--orange);margin:30px 0 16px}
.sec h2{font:700 28px/1 "Barlow Condensed",Barlow,sans-serif;margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.card .img{aspect-ratio:16/9;background:var(--navy) center/cover}
.card .b{padding:14px 16px 18px}
.card h3{font:700 22px/1.15 "Barlow Condensed",Barlow,sans-serif;margin:6px 0}
.card p{margin:0;color:var(--muted);font-size:15px}
.card:hover h3{color:var(--orange)}
.meta{color:var(--muted);font-size:13px}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px}

/* haber detayı */
dialog{border:0;border-radius:8px;padding:0;max-width:720px;width:calc(100% - 24px);max-height:90vh;overflow:auto;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(5,12,28,.65)}
dialog .img{aspect-ratio:16/9;background:var(--navy) center/cover}
dialog .b{padding:20px 24px 26px}
dialog h2{font:700 34px/1.1 "Barlow Condensed",Barlow,sans-serif;margin:6px 0 10px}
dialog .body{white-space:pre-line;max-width:62ch}
dialog .x{float:right;background:var(--navy);color:#fff;border:0;border-radius:4px;padding:8px 14px;font:600 16px Barlow,sans-serif;cursor:pointer;margin:12px 12px 0 0}

footer{background:var(--navy);color:var(--navy-ink);margin-top:40px;padding:26px 0;font-size:15px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{opacity:.85}footer a:hover{opacity:1}

:root[data-theme="dark"]{
  --bg:#0b1322; --surface:#121d33; --ink:#eaf0fb; --muted:#9aa7bf; --line:#23304d;
  --navy:#0a1a33; --navy-ink:#ffffff; color-scheme:dark;
}
.top .tools{display:flex;align-items:center;gap:16px}
.tema{position:relative;flex:none;width:60px;height:30px;border-radius:999px;border:0;padding:0;cursor:pointer;background:rgba(255,255,255,.2);transition:background .25s}
.tema:hover{background:rgba(255,255,255,.3)}
.tema .knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--orange);box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .25s}
.tema svg{position:absolute;top:7px;width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.6;transition:opacity .25s}
.tema .sun{left:8px}.tema .moon{right:8px}
:root:not([data-theme="dark"]) .tema .sun,:root[data-theme="dark"] .tema .moon{opacity:1}
:root[data-theme="dark"] .tema .knob{transform:translateX(30px)}
:root{--kirmizi:#e85d0c}
:root[data-theme="dark"]{--kirmizi:#f0702a}
.fk{margin:38px 0 0;scroll-margin-top:12px}
.fk-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap;border-bottom:1px solid var(--ink);padding-bottom:12px}
.fk-head h2{font:700 clamp(34px,6vw,56px)/1 "Barlow Condensed",Barlow,sans-serif;text-transform:uppercase;margin:0}
.fk-sub,.fk-not,.fk-all{font-family:"Space Mono",ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase;letter-spacing:.06em}
.fk-sub{font-size:12px;color:var(--muted)}
.fk-grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);margin-top:22px}
.fk-tile{display:block;min-height:150px;padding:20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);color:var(--ink)}
.fk-tile span{display:block}
.fk-tile .ay{font:700 30px/1 "Barlow Condensed",Barlow,sans-serif;text-transform:uppercase}
.fk-tile .yil{font:700 13px "Space Mono",ui-monospace,Menlo,Consolas,monospace;margin-top:8px}
.fk-tile .dur{font:700 12px "Space Mono",ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase;margin-top:26px}
.fk-tile.off{color:var(--muted);background:var(--bg)}
.fk-tile.off .ay{opacity:.6}
.fk-tile.on{background:var(--kirmizi);color:#fff;transition:filter .15s}
.fk-tile.on:hover{filter:brightness(1.1)}
.fk-tile.on:focus-visible{outline-color:#fff;outline-offset:-5px}
.fk-foot{display:flex;justify-content:space-between;align-items:center;gap:12px 20px;flex-wrap:wrap;margin-top:18px}
.fk-not{font-size:12px;color:var(--muted)}
.fk-all{font-size:13px;font-weight:700;color:var(--kirmizi);border-bottom:2px solid var(--kirmizi);padding-bottom:3px}
.fk-btn{font:inherit;text-align:left;border:0;width:100%;cursor:pointer;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
#menuDlg{max-width:520px}
#menuDlg .b{padding:20px 24px 24px}
#menuDlg h2{font:700 30px/1.1 "Barlow Condensed",Barlow,sans-serif;margin:0 0 4px}
#menuDlg .alt{color:var(--muted);font-size:14px;margin:0 0 14px}
#menuDlg .dosya{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-weight:600}
#menuDlg .dosya:hover{border-color:var(--orange);color:var(--orange)}
#menuDlg .dosya i{flex:none;font:700 12px "Space Mono",ui-monospace,monospace;background:var(--kirmizi);color:#fff;border-radius:3px;padding:5px 7px;font-style:normal}
#menuDlg .dosya span{flex:1;line-height:1.3}
@media (max-width:900px){.fk-grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .lead{min-height:300px}.lead h2{font-size:30px}
}
/* telefon uyumu */
@media (max-width:600px){
  .top{font-size:13px}
  .top .wrap{min-height:40px}
  .top .tools{gap:12px}
  .brand{gap:10px;padding:12px 0}
  .logo{width:48px;height:48px}
    .brand h1{font-size:23px;line-height:1.05}
  .brand small{font-size:12px}
  nav.main a{padding:13px 14px;font-size:17px}
  .hero{margin:16px 0}
  .lead{min-height:260px}.lead .txt{padding:16px}.lead h2{font-size:26px}
  .sec h2{font-size:24px}
  .card h3{font-size:20px}
    dialog .b{padding:16px 16px 22px}dialog h2{font-size:28px}
  footer .wrap{flex-direction:column}
}
@media (max-width:520px){.fk-grid{grid-template-columns:repeat(2,1fr)}.fk-tile{min-height:130px;padding:16px}.fk-tile .ay{font-size:26px}}
@media (max-width:380px){.top .wrap{flex-wrap:wrap;padding-top:6px;padding-bottom:6px}#today{font-size:12px}}
@media (max-width:600px){.lead.has-img h2{font-size:24px}.lead.has-img .txt{padding:14px 16px 18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="top"><div class="wrap">
  <span id="today"></span>
  <div class="tools">
    <button class="tema" id="tema" type="button" role="switch" aria-checked="false" aria-label="Koyu tema" title="Koyu temaya geç">
      <span class="knob"></span>
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>
    </button>
    <a href="#iletisim">İletişim</a>
  </div>
</div></div>

<header class="site"><div class="wrap">
  <a class="brand" href="#">
    <img class="logo" src="logo.jpg" alt="Malatya Basketbol İl Temsilciliği logosu" width="64" height="64">
    <span><h1>Malatya Basketbol Temsilciliği</h1><small>Malatya basketbolunun haber ve fikstür adresi</small></span>
  </a>
</div></header>

<nav class="main" aria-label="Ana menü"><div class="wrap"><ul>
  <li><a href="#">Anasayfa</a></li>
  <li><a href="#haberler">Haberler</a></li>
  <li><a href="#fikstur">Fikstür</a></li>
  <li><a href="#iletisim">İletişim</a></li>
</ul></div></nav>

<main class="wrap">
  <section class="hero" id="hero" aria-label="Manşet"></section>

  <section class="fk" id="fikstur">
    <div class="fk-head"><h2>Fikstür Bültenleri</h2><span class="fk-sub" id="fkSub"></span></div>
    <div class="fk-grid" id="fkGrid"></div>
    <div class="fk-foot">
      <span class="fk-not" id="fkNot"></span>
    </div>
  </section>

  <div class="sec" id="haberler"><h2>Haberler</h2></div>
  <section class="grid" id="grid"></section>
</main>

<footer id="iletisim"><div class="wrap">
  <span>© <span id="yil"></span> malatyabasket.com</span>
</div></footer>

<dialog id="dlg" aria-label="Haber detayı">
  <button class="x" id="kapat">Kapat</button>
  <div class="img" id="dImg"></div>
  <div class="b">
    <span class="meta" id="dDate"></span>
    <h2 id="dTitle"></h2>
    <div class="body" id="dBody"></div>
  </div>
</dialog>

<dialog id="menuDlg" aria-label="Fikstür bültenleri">
  <button class="x" id="menuKapat" type="button">Kapat</button>
  <div class="b">
    <h2 id="menuBaslik"></h2>
    <p class="alt">Görmek istediğiniz bülteni seçin</p>
    <div id="menuListe"></div>
  </div>
</dialog>

<script>
/* ============ AYARLAR ============ */

// Aralık linki hazır olunca tırnakların içine yazın; boşsa kutu gri "YAKINDA" görünür.
const KASIM_DOSYALAR = [
  {ad:"4. Kamu Spor Oyunları 3x3 Basketbol — Bölge Finali", url:"kasim-fikstur.pdf"}
  // Yeni turnuva eklemek için üstteki satırın sonuna virgül koyup şunu ekleyin:
  // ,{ad:"Turnuva adı", url:"dosya-adi.pdf"}
];

// Aralık bültenleri: PDF hazır olunca listeye şu şekilde ekleyin:
// {ad:"Turnuva adı", url:"aralik-fikstur.pdf"}
const ARALIK_DOSYALAR = [];

// Haberler: yeni haber eklemek için listenin BAŞINA bir blok ekleyin.
// image boş bırakılabilir ("").
const NEWS = [
  {
    date: "2026-10-20",
    category: "Duyuru",
    title: "Kamu Sporları Basketbol Bölge Turnuvası Başlıyor!",
    summary: "Malatya basketbolunda yeni sezon öncesi son hazırlıklar tamamlandı.",
    body: "Malatya basketbolunda yeni sezon öncesi son hazırlıklar tamamlandı.\n\nMaç programı ve ayrıntılar için Fikstür sayfasını takip edebilirsiniz.",
    image: "kamu-spor-oyunlari-aydinlik.png"
  },
  {
    date: "2026-10-15",
    category: "Haber",
    title: "Örnek haber başlığı",
    summary: "Bu bir örnek haberdir. Kendi haberinizle değiştirin.",
    body: "Bu bir örnek haberdir. NEWS listesindeki bloğu kendi başlığınız, özetiniz ve metninizle değiştirin.",
    image: ""
  }
];

// Fikstür bültenleri: url dolu ise kutu turuncu "GÜNCEL" olur, boş ("") ise gri "YAKINDA" kalır.
const FK_ALT = "2026/27 — Yerel Lig Müsabakaları";
const FK_NOT = "Hazırlık, okul ve 3x3 müsabakaları için ayrı bültenler yayımlanır.";
const FIKSTUR_AYLARI = [
  {ay:"Kasım",   yil:2026, no:null, url:"", dosyalar:KASIM_DOSYALAR},
  {ay:"Aralık",  yil:2026, no:null, url:"", dosyalar:ARALIK_DOSYALAR},
  {ay:"Ocak",    yil:2027, no:null, url:""},
  {ay:"Şubat",   yil:2027, no:null, url:""},
  {ay:"Mart",    yil:2027, no:null, url:""},
  {ay:"Nisan",   yil:2027, no:null, url:""},
  {ay:"Mayıs",   yil:2027, no:null, url:""},
  {ay:"Haziran", yil:2027, no:null, url:""}
];

/* ============ KOD ============ */
const aylar=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const tr = d => { const t=new Date(d+"T12:00:00"); return t.getDate()+" "+aylar[t.getMonth()]+" "+t.getFullYear(); };
const esc = s => String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bg = u => u ? `style="background-image:url('${esc(u)}')"` : "";

// Güncel tarih ve saat (Türkiye saati, her saniye güncellenir)
const gunler=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
function saatYaz(){
  const p = {};
  new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Istanbul",year:"numeric",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false,weekday:"short"})
    .formatToParts(new Date()).forEach(x=>p[x.type]=x.value);
  const gunIdx = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(p.weekday);
  const hh = p.hour==="24" ? "00" : p.hour;
  document.getElementById("today").textContent =
    p.day+" "+aylar[+p.month-1]+" "+p.year+", "+gunler[gunIdx]+" "+hh+":"+p.minute+":"+p.second;
}
saatYaz(); setInterval(saatYaz,1000);
document.getElementById("yil").textContent = new Date().getFullYear();

const list = [...NEWS].sort((a,b)=>b.date.localeCompare(a.date));
const hero = document.getElementById("hero");
const grid = document.getElementById("grid");

if(!list.length){
  grid.innerHTML = '<div class="empty">Henüz haber yok.</div>';
}else{
  const f = list[0], rest = list.slice(1,6);
  hero.innerHTML = `
    <a class="lead${f.image?' has-img':''}" href="#" data-i="0">
      <div class="img" ${bg(f.image)}></div>
      <div class="txt"><span class="tag">${esc(f.category)}</span>
        <h2>${esc(f.title)}</h2><p>${esc(f.summary)}</p></div>
    </a>
    <div class="side">
      <div class="fixcard">
        <h3>Fikstür</h3>
        <p>Aylık fikstür bültenlerini görmek için tıklayın.</p>
        <a class="btn" href="#fikstur">Fikstürleri gör</a>
      </div>
      <div class="latest"><h3>Son haberler</h3>
        ${rest.length ? rest.map((n,i)=>`<a href="#" data-i="${i+1}">${esc(n.title)}<time>${tr(n.date)}</time></a>`).join("") : '<a href="#" data-i="0">'+esc(f.title)+'<time>'+tr(f.date)+'</time></a>'}
      </div>
    </div>`;
  grid.innerHTML = list.map((n,i)=>`
    <a class="card" href="#" data-i="${i}">
      <div class="img" ${bg(n.image)}></div>
      <div class="b"><span class="meta">${esc(n.category)} · ${tr(n.date)}</span>
        <h3>${esc(n.title)}</h3><p>${esc(n.summary)}</p></div>
    </a>`).join("");
}

document.getElementById("fkSub").textContent = FK_ALT;
document.getElementById("fkNot").textContent = FK_NOT;
document.getElementById("fkGrid").innerHTML = FIKSTUR_AYLARI.map(m=>{
  const ic = `<span class="ay">${esc(m.ay)}</span><span class="yil">${m.yil}</span>`;
  if(m.dosyalar) return `<button type="button" class="fk-tile on fk-btn" data-menu="${esc(m.ay)}">${ic}<span class="dur">Güncel${m.dosyalar.length ? " — "+m.dosyalar.length+" bülten" : ""}</span></button>`;
  if(m.url) return `<a class="fk-tile on" href="${esc(m.url)}" target="_blank" rel="noopener">${ic}<span class="dur">Güncel${m.no ? " — No "+m.no : ""}</span></a>`;
  return `<div class="fk-tile off">${ic}<span class="dur">Yakında</span></div>`;
}).join("");

const menuDlg = document.getElementById("menuDlg");
document.getElementById("fkGrid").addEventListener("click", e=>{
  const b = e.target.closest("[data-menu]");
  if(!b) return;
  const m = FIKSTUR_AYLARI.find(x=>x.ay===b.dataset.menu);
  document.getElementById("menuBaslik").textContent = m.ay+" "+m.yil+" Fikstür Bültenleri";
  document.getElementById("menuListe").innerHTML = !m.dosyalar.length ? '<p class="alt">Bu ayın bültenleri yakında eklenecek.</p>' : m.dosyalar.map(d=>
    `<a class="dosya" href="${esc(d.url)}" target="_blank" rel="noopener"><i>PDF</i><span>${esc(d.ad)}</span></a>`).join("");
  menuDlg.showModal();
});
document.getElementById("menuKapat").onclick = ()=>menuDlg.close();
menuDlg.addEventListener("click", e=>{ if(e.target===menuDlg) menuDlg.close(); });

const root = document.documentElement, tbtn = document.getElementById("tema");
function setTema(koyu){
  root.dataset.theme = koyu ? "dark" : "light";
  tbtn.setAttribute("aria-checked", koyu);
  tbtn.title = koyu ? "Aydınlık temaya geç" : "Koyu temaya geç";
}
let kayitli = null;
try{ kayitli = localStorage.getItem("tema"); }catch(e){}
setTema(kayitli === "dark");
tbtn.addEventListener("click", ()=>{
  const koyu = root.dataset.theme !== "dark";
  setTema(koyu);
  try{ localStorage.setItem("tema", koyu ? "dark" : "light"); }catch(e){}
});

const dlg = document.getElementById("dlg");
document.addEventListener("click", e=>{
  const a = e.target.closest("[data-i]");
  if(!a) return;
  e.preventDefault();
  const n = list[+a.dataset.i];
  document.getElementById("dImg").style.backgroundImage = n.image ? `url('${n.image}')` : "none";
  document.getElementById("dImg").style.display = n.image ? "block" : "none";
  document.getElementById("dDate").textContent = n.category+" · "+tr(n.date);
  document.getElementById("dTitle").textContent = n.title;
  document.getElementById("dBody").textContent = n.body || n.summary;
  dlg.showModal();
});
document.getElementById("kapat").onclick = ()=>dlg.close();
dlg.addEventListener("click", e=>{ if(e.target===dlg) dlg.close(); });
</script>
</body>
</html>
